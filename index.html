<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventory Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- HALAMAN LOGIN -->
    <div id="login-section" class="flex items-center justify-center h-screen px-4">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Login Petugas</h1>
            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                    <input type="password" id="password" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700">Masuk</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden text-center">Email/Password salah!</p>
        </div>
    </div>

    <!-- HALAMAN UTAMA (Setelah Login) -->
    <div id="main-section" class="hidden">
        <!-- Navbar -->
        <nav class="bg-blue-600 text-white p-4 flex justify-between items-center sticky top-0 z-10">
            <h1 class="font-bold text-lg">Gudang App</h1>
            <button id="logout-btn" class="bg-red-500 px-3 py-1 rounded text-sm">Logout</button>
        </nav>

        <!-- Menu Navigasi Berdasarkan Role -->
        <div class="p-4 flex gap-2 overflow-x-auto whitespace-nowrap bg-white shadow-sm mb-4">
            <button class="role-btn bg-blue-100 text-blue-700 px-4 py-2 rounded-lg font-medium" onclick="showForm('incoming', event)">Gudang</button>
            <button class="role-btn bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-medium" onclick="showForm('qc', event)">QC</button>
            <button class="role-btn bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-medium" onclick="showForm('supply', event)">Supply</button>
            <button class="role-btn bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-medium" onclick="showForm('finish', event)">Finish Good</button>
        </div>

        <!-- WADAH FORM INPUT -->
        <div class="px-4 pb-10">
            <div id="form-container" class="bg-white rounded-lg shadow-md p-4">
                <!-- Form akan di-render di sini oleh Javascript -->
            </div>
        </div>
    </div>

    <!-- PANGGIL FILE JS DI SINI -->
    <script src="app.js"></script>
</body>
</html>
